<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean Lab Web RX v10</title>
    <style>
        body { background:#050505; color:#00ff88; font-family:monospace; padding:20px; text-align:center; }
        canvas { border:4px solid #00ff88; image-rendering:pixelated; width:640px; height:400px; background:#000; display:block; margin: 0 auto; }
        .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; width:640px; margin:20px auto; background:#111; padding:10px; border:1px solid #333; }
        .meter { height:10px; width:640px; background:#222; margin:10px auto; border:1px solid #00ff88; overflow:hidden; }
        #bar { height:100%; width:0%; background:#00ff88; }
        button { background:#00ff88; color:#000; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; margin:5px; }
        #log { background:#000; color:#888; border:1px solid #333; width:640px; height:100px; margin: 10px auto; overflow-y: scroll; text-align: left; font-size: 12px; padding: 5px; }
    </style>
</head>
<body>
    <h1>OCEAN LAB WEB RX v9</h1>
    <canvas id="screen" width="320" height="200"></canvas>
    <div class="meter"><div id="bar"></div></div>
    
    <div class="stats">
        <div>Cells: <span id="count">0/1000</span></div>
        <div>Baud: 1800</div>
        <div>Status: <span id="status">IDLE</span></div>
    </div>

    <button id="btnPlay">PLAY GITHUB TEST WAV</button>
    <button id="btnMic">USE MICROPHONE</button>
    <div id="log"></div>

    <script>
        const palette = ["#000000","#ffffff","#883932","#67b6bd","#8b3f96","#55a049","#40318d","#bfce72","#8b5429","#574200","#b86962","#505050","#787878","#94e089","#7869c4","#9f9f9f"];
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        let audioCtx, workletNode;

        function addLog(msg) {
            const l = document.getElementById('log');
            l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        function drawCell(idx, bitmap, scr, col, bg) {
            const cx = idx % 40;
            const cy = Math.floor(idx / 40);
            const x0 = cx * 8;
            const y0 = cy * 8;
            const colors = [bg&15, (scr>>4)&15, scr&15, col&15];

            for (let r = 0; r < 8; r++) {
                let byte = bitmap[r];
                for (let p = 0; p < 4; p++) {
                    let v = (byte >> (6 - p * 2)) & 3;
                    ctx.fillStyle = palette[colors[v]];
                    ctx.fillRect(x0 + (p * 2), y0 + r, 2, 1);
                }
            }
        }

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new AudioContext({ sampleRate: 48000 });
            await audioCtx.audioWorklet.addModule('processor.js');
            workletNode = new AudioWorkletNode(audioCtx, 'ocean-processor');
            
            workletNode.port.onmessage = (e) => {
                if(e.data.type === 'PEAK') {
                    document.getElementById('bar').style.width = (e.data.value * 150) + "%";
                } else if (e.data.type === 'LOG') {
                    addLog(e.data.msg);
                } else if (e.data.type === 'CELL') {
                    const c = e.data.data;
                    drawCell(c.cell_index, c.bitmap, c.screen, c.colour, c.bg);
                    document.getElementById('count').textContent = `${parseInt(document.getElementById('count').textContent)+1}/1000`;
                }
            };
        }

        document.getElementById('btnPlay').onclick = async () => {
            await initAudio();
            addLog("Fetching rat_2fsk_1200_1800_ecc_music.wav...");
            const url = "https://raw.githubusercontent.com/markusgecko/c64load/main/rat_2fsk_1200_1800_ecc_music.wav";
            const resp = await fetch(url);
            const buf = await audioCtx.decodeAudioData(await resp.arrayBuffer());
            
            const source = audioCtx.createBufferSource();
            source.buffer = buf;
            source.connect(workletNode);
            workletNode.connect(audioCtx.destination);
            source.start();
            document.getElementById('status').textContent = "PLAYING TEST FILE";
        };

        document.getElementById('btnMic').onclick = async () => {
            await initAudio();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(workletNode);
            document.getElementById('status').textContent = "LISTENING (MIC)";
            addLog("Microphone active.");
        };
    </script>
</body>
</html>
