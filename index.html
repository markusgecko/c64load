<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean Lab 2FSK Decoder</title>
    <style>
        body { background: #050505; color: #00ff88; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; border: 1px solid #00ff88; padding: 20px; box-shadow: 0 0 15px #00ff88; }
        .panel { border: 1px solid #004422; padding: 15px; margin-bottom: 20px; background: #080808; }
        #log { background: #000; border: 1px solid #004422; height: 180px; overflow-y: auto; padding: 10px; margin: 10px 0; font-size: 0.85em; color: #00cc66; }
        .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .group-box { border: 1px solid #004422; padding: 8px; text-align: center; font-size: 11px; background: #000; }
        .chunk-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 5px; }
        .dot { width: 8px; height: 8px; background: #222; }
        .dot.received { background: #00ff88; box-shadow: 0 0 5px #00ff88; }
        .dot.recovered { background: #ff00ff; box-shadow: 0 0 5px #ff00ff; }
        .btn { background: #00ff88; border: none; padding: 10px 15px; cursor: pointer; font-family: inherit; font-weight: bold; color: #000; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>OCEAN LAB: 2FSK XOR 8+1</h1>
    
    <div class="panel">
        <strong>SOURCE: <span id="audio-status">OFFLINE</span></strong><br><br>
        <button id="mic-btn" class="btn">START MIC</button>
        <button id="test-rat-btn" class="btn">TEST REPO WAV</button>
        <button id="upload-trigger" class="btn">LOAD LOCAL WAV</button>
        <input type="file" id="wav-upload" accept="audio/wav" style="display:none;">
    </div>

    <div id="log"></div>
    <div class="group-grid" id="grid"></div>
    
    <div id="download-area" style="margin-top:20px; display:none;">
        <button id="dl-btn" class="btn" style="width:100%; height:50px;">💾 DOWNLOAD RAT.PRG</button>
    </div>
</div>

<script>
const BAUD = 1200, TONE_0 = 1200, TONE_1 = 1800, CHUNK_SIZE = 64;
const SYNC = [0xA7, 0x5A, 0xC3, 0x3C];
let audioCtx, processor, sourceNode, groups = {}, bitBuffer = [], totalFileSize = 0;

const log = (msg) => {
    const d = document.getElementById('log');
    d.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    d.scrollTop = d.scrollHeight;
};

// --- XOR Recovery ---
function tryXOR(gid) {
    const g = groups[gid], ids = Object.keys(g).map(Number);
    if (ids.length === 8) {
        const mid = [0,1,2,3,4,5,6,7,8].find(id => !ids.includes(id));
        const res = new Uint8Array(CHUNK_SIZE);
        for (const id in g) { for (let i=0; i<CHUNK_SIZE; i++) res[i] ^= g[id].payload[i]; }
        groups[gid][mid] = { payload: res, method: 'recovered' };
        log(`Group ${gid}: Rebuilt chunk ${mid} via XOR`);
        updateGrid();
    }
}

// --- Frame Processing ---
function processBytes(bytes) {
    if (!window.sBuf) window.sBuf = [];
    window.sBuf.push(...bytes);
    if (window.sBuf.length > 5000) window.sBuf.shift();
    const b = window.sBuf;
    for (let i=0; i <= b.length - 72; i++) {
        if (b[i]===SYNC[0] && b[i+1]===SYNC[1] && b[i+2]===SYNC[2] && b[i+3]===SYNC[3]) {
            const len = (b[i+4]<<8) | b[i+5];
            const body = b.slice(i+6, i+6+len);
            if (body.length >= 8) {
                const gId = (body[1]<<8) | body[2], cId = body[3];
                totalFileSize = (body[4]<<24)|(body[5]<<16)|(body[6]<<8)|body[7];
                if (!groups[gId]) groups[gId] = {};
                if (!groups[gId][cId]) {
                    groups[gId][cId] = { payload: new Uint8Array(body.slice(8)), method: 'received' };
                    tryXOR(gId); updateGrid();
                }
                if (body[0] === 0xFF) { document.getElementById('download-area').style.display='block'; log("END Frame detected."); }
            }
        }
    }
}

// --- Audio DSP ---
async function setupDSP() {
    if (!audioCtx) audioCtx = new AudioContext({sampleRate: 48000});
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (processor) processor.disconnect();
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    const sps = 48000 / BAUD;
    let samples = new Float32Array(0);

    processor.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);
        let combined = new Float32Array(samples.length + input.length);
        combined.set(samples); combined.set(input, samples.length);
        while (combined.length >= sps) {
            const chunk = combined.slice(0, sps); combined = combined.slice(sps);
            let p0 = 0, p1 = 0;
            for (let i=0; i<sps; i++) {
                const phi = 2 * Math.PI * i / 48000;
                p0 += chunk[i] * Math.sin(phi * TONE_0);
                p1 += chunk[i] * Math.sin(phi * TONE_1);
            }
            bitBuffer.push(Math.abs(p1) > Math.abs(p0) ? 1 : 0);
            if (bitBuffer.length >= 8) {
                let byte = 0;
                for (let b=0; b<8; b++) byte = (byte << 1) | bitBuffer.shift();
                processBytes([byte]);
            }
        }
        samples = combined;
    };
    processor.connect(audioCtx.destination);
    return processor;
}

// --- Interface Handlers ---
document.getElementById('mic-btn').onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const p = await setupDSP();
    audioCtx.createMediaStreamSource(stream).connect(p);
    document.getElementById('audio-status').innerText = 'LIVE MIC';
};

async function playBuf(buffer, label) {
    const p = await setupDSP();
    if (sourceNode) sourceNode.stop();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = buffer;
    sourceNode.connect(p); // Connect directly to the DSP processor
    sourceNode.start(0);
    document.getElementById('audio-status').innerText = 'WAV PLAY';
    log(`Piping ${label} into DSP...`);
}

document.getElementById('upload-trigger').onclick = () => document.getElementById('wav-upload').click();
document.getElementById('wav-upload').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const buf = await (audioCtx || new AudioContext()).decodeAudioData(await f.arrayBuffer());
    playBuf(buf, f.name);
};

document.getElementById('test-rat-btn').onclick = async () => {
    log("Fetching test file...");
    try {
        const r = await fetch('./rat_2fsk_xor8_test.wav');
        if (!r.ok) throw new Error("File not found on server.");
        const ab = await r.arrayBuffer();
        const buf = await (audioCtx || new AudioContext({sampleRate: 48000})).decodeAudioData(ab);
        playBuf(buf, "rat_2fsk_xor8_test.wav");
    } catch(err) { log("Error: " + err.message); }
};

document.getElementById('dl-btn').onclick = () => {
    const gks = Object.keys(groups).sort((a,b)=>a-b);
    let out = new Uint8Array(gks.length * 8 * CHUNK_SIZE);
    gks.forEach(gid => {
        for (let cid=0; cid<8; cid++) {
            if (groups[gid][cid]) out.set(groups[gid][cid].payload, (gid*8+cid)*64);
        }
    });
    const blob = new Blob([out.slice(0, totalFileSize)], {type: 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'rat.prg'; a.click();
};

function updateGrid() {
    const grid = document.getElementById('grid'); grid.innerHTML = '';
    Object.keys(groups).sort((a,b)=>a-b).forEach(gid => {
        const box = document.createElement('div'); box.className = 'group-box'; box.innerHTML = `GRP ${gid}`;
        const dots = document.createElement('div'); dots.className = 'chunk-dots';
        for (let i=0; i<9; i++) {
            const d = document.createElement('div');
            d.className = 'dot' + (groups[gid][i] ? ' ' + groups[gid][i].method : '');
            dots.appendChild(d);
        }
        box.appendChild(dots); grid.appendChild(box);
    });
}
</script>
</body>
</html>
